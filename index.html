<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ead8cf">
  <title>دعوت‌نامه بله‌برون سارا و حسین</title>
  <style>
    :root {
      --paper:#fff7f5;
      --rose:#bf6f86;
      --rose-dark:#7d3f55;
      --blush:#efc6d1;
      --pink:#e8aebe;
      --gold:#b69260;
      --ink:#5a403e;
    }
    * { box-sizing:border-box }
    html,body { min-height:100%; margin:0 }
    body {
      overflow:hidden;
      background:#efd4dc;
      color:var(--ink);
      font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    }
    button,a { font:inherit; -webkit-tap-highlight-color:transparent }
    .stage {
      position:relative;
      min-height:100svh;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 15%,rgba(255,255,255,.96),transparent 37%),
        radial-gradient(circle at 8% 85%,rgba(191,111,134,.2),transparent 29%),
        radial-gradient(circle at 92% 18%,rgba(232,174,190,.24),transparent 25%),
        linear-gradient(145deg,#edcdd7,#fae9ee 50%,#e3bcc9);
    }
    .stage::before,.stage::after {
      position:absolute;
      top:-20%;
      width:38vw;
      height:140vh;
      content:"";
      opacity:.52;
      background:repeating-linear-gradient(42deg,rgba(255,255,255,.3) 0 2px,transparent 2px 12px);
      transform:rotate(8deg);
      pointer-events:none;
    }
    .stage::before { left:-20% }
    .stage::after { right:-20%; transform:rotate(-8deg) }
    .sparkles { position:absolute; inset:0; pointer-events:none }
    .sparkles i {
      position:absolute;
      width:5px; height:5px;
      border-radius:50%;
      background:rgba(255,255,255,.9);
      box-shadow:0 0 12px rgba(255,255,255,.9);
      animation:twinkle 2.8s ease-in-out infinite;
    }
    .sparkles i:nth-child(1){top:16%;left:15%}
    .sparkles i:nth-child(2){top:27%;right:12%;animation-delay:.7s}
    .sparkles i:nth-child(3){bottom:17%;left:18%;animation-delay:1.3s}
    .sparkles i:nth-child(4){bottom:22%;right:16%;animation-delay:2s}
    .wrap {
      position:absolute;
      top:50%; left:50%;
      width:min(92vw,430px);
      height:min(780px,94svh);
      transform:translate(-50%,-50%);
    }
    .card {
      position:absolute;
      z-index:2;
      top:19%; left:50%;
      width:88%;
      height:68%;
      overflow:hidden;
      border:1px solid rgba(191,111,134,.42);
      border-radius:4px;
      background:
        linear-gradient(rgba(255,247,245,.97),rgba(255,247,245,.97)),
        repeating-linear-gradient(17deg,transparent 0 8px,rgba(110,68,62,.08) 8px 9px);
      box-shadow:0 16px 38px rgba(83,50,47,.2);
      opacity:.01;
      transform:translate(-50%,25%) scale(.9);
      transition:transform 1.9s cubic-bezier(.2,.78,.16,1) 1.05s,opacity .7s ease .92s;
    }
    .opened .card { z-index:9; opacity:1; transform:translate(-50%,-18%) scale(1) }
    .card::before {
      position:absolute;
      inset:16px;
      border:1px solid rgba(182,146,96,.55);
      border-radius:49% 49% 5px 5px/5% 5% 2px 2px;
      content:"";
      pointer-events:none;
    }
    .lace {
      position:absolute;
      z-index:1;
      right:-8px; left:-8px;
      height:34px;
      background:
        radial-gradient(circle at 17px 0,transparent 13px,rgba(240,200,212,.9) 14px 17px,transparent 18px) 0 0/34px 34px repeat-x,
        radial-gradient(circle at 17px 9px,transparent 3px,rgba(191,111,134,.38) 4px 6px,transparent 7px) 0 0/34px 34px repeat-x;
      filter:drop-shadow(0 2px 2px rgba(125,63,85,.08));
    }
    .lace.top { top:0 }
    .lace.bottom { bottom:0; transform:rotate(180deg) }
    .guipure {
      position:absolute;
      z-index:2;
      top:38px;
      bottom:38px;
      width:22px;
      opacity:.72;
      background:
        radial-gradient(circle at center,transparent 0 4px,rgba(240,200,212,.92) 4px 6px,transparent 6.5px) 0 0/20px 20px,
        repeating-linear-gradient(45deg,rgba(191,111,134,.2) 0 1px,transparent 1px 8px);
      pointer-events:none;
    }
    .guipure.left { left:4px }
    .guipure.right { right:4px }
    .content {
      position:relative;
      display:flex;
      height:100%;
      flex-direction:column;
      align-items:center;
      padding:42px 28px 31px;
      text-align:center;
    }
    .intro { margin:1px 0 7px; color:var(--gold); font-size:11px }
    h1 {
      margin:0;
      color:var(--rose-dark);
      font-family:"B Nazanin",Tahoma,serif;
      font-size:clamp(37px,11vw,50px);
      font-weight:500;
      line-height:1.25;
    }
    h1 span { color:var(--gold); font-size:.6em }
    .ornament { display:flex; width:145px; align-items:center; gap:8px; margin:1px 0 14px; color:var(--gold); font-size:8px }
    .ornament::before,.ornament::after { height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--gold)); content:"" }
    .ornament::after { transform:scaleX(-1) }
    .copy { margin:0 0 13px; font-family:"B Nazanin",Tahoma,serif; font-size:16px; line-height:1.9 }
    .label { display:block; margin-bottom:3px; color:var(--rose); font-size:9px; letter-spacing:.07em }
    .time { margin:0; font-size:14px }
    .date { margin:0 0 10px; color:var(--rose-dark); font-size:14px; font-weight:700 }
    .divider { width:22px; height:1px; margin:12px auto 9px; background:var(--gold) }
    .address { max-width:310px; margin:0; font-size:11.5px; line-height:1.85 }
    .map {
      margin-top:12px;
      border-bottom:1px solid rgba(182,146,96,.55);
      color:var(--rose-dark);
      font-size:10px;
      text-decoration:none;
    }
    .footer { margin:auto 0 0; color:var(--gold); font-size:10px }
    .envelope {
      position:absolute;
      z-index:8;
      top:51%; left:50%;
      width:100%;
      aspect-ratio:1.47/1;
      padding:0;
      border:0;
      background:transparent;
      cursor:pointer;
      filter:drop-shadow(0 24px 25px rgba(81,49,45,.25));
      outline:0;
      transform:translate(-50%,-10%);
      transition:transform 1.35s ease 2.25s,opacity 1.05s ease 2.25s;
    }
    .envelope span { position:absolute; display:block }
    .back { inset:0; border-radius:6px; background:#efc4d0 }
    .lining {
      inset:0;
      clip-path:polygon(0 0,100% 0,50% 72%);
      background:
        radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.78) 3px 4px,transparent 4px) 0 0/18px 18px,
        repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 1px,transparent 1px 8px),
        #c87f96;
    }
    .flap {
      z-index:5;
      inset:0;
      clip-path:polygon(0 0,100% 0,50% 69%);
      background:
        radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.82) 3px 4px,transparent 4.5px) 0 0/18px 18px,
        radial-gradient(circle,rgba(255,255,255,.7) 0 1.5px,transparent 2px) 9px 9px/18px 18px,
        linear-gradient(155deg,#f8dce6,#dfa9ba);
      transform-origin:top center;
      transform:perspective(1200px) rotateX(0);
      transition:transform 1.65s cubic-bezier(.43,0,.2,1);
      backface-visibility:hidden;
    }
    .left { z-index:3; inset:0; clip-path:polygon(0 0,56% 50%,0 100%); background:linear-gradient(80deg,#f7dbe4,#e5b0c0) }
    .right { z-index:3; inset:0; clip-path:polygon(100% 0,44% 50%,100% 100%); background:linear-gradient(-80deg,#f6d8e1,#dfa7b8) }
    .front {
      z-index:4;
      inset:0;
      clip-path:polygon(0 100%,0 51%,50% 73%,100% 51%,100% 100%);
      border-radius:0 0 6px 6px;
      background:
        radial-gradient(circle at 9px 9px,transparent 0 4px,rgba(255,255,255,.72) 4px 5.5px,transparent 6px) 0 0/18px 18px,
        repeating-linear-gradient(-45deg,rgba(255,255,255,.21) 0 1px,transparent 1px 10px),
        linear-gradient(0deg,#f6d5df,#e3aabd);
    }
    .seal {
      z-index:7;
      top:48%; left:50%;
      display:flex!important;
      width:74px; height:74px;
      align-items:center; justify-content:center;
      border:2px solid rgba(255,255,255,.22);
      border-radius:48% 52% 44% 56%;
      background:
        radial-gradient(circle at 37% 30%,rgba(255,255,255,.25),transparent 18%),
        radial-gradient(circle,#aa696d 0 57%,#8c5358 59% 66%,#aa6c70 68%);
      box-shadow:0 6px 10px rgba(82,44,47,.35),inset 0 0 0 5px rgba(91,47,51,.14);
      color:#f9ded6;
      font-family:Georgia,Tahoma,serif;
      font-size:17px;
      transform:translate(-50%,-50%) rotate(-4deg);
      transition:opacity .6s ease .6s,transform .6s ease .6s;
    }
    .seal b { margin:0 3px; color:#e5b7b1; font-size:10px; font-weight:400 }
    .hint {
      z-index:10;
      right:0; bottom:-44px; left:0;
      color:#71504d;
      font-size:12px;
      text-align:center;
      animation:breathe 2s ease-in-out infinite;
    }
    .opened .flap { z-index:1; transform:perspective(1200px) rotateX(180deg) }
    .opened .seal { opacity:0; transform:translate(-50%,-75%) scale(.7) rotate(12deg) }
    .opened .envelope { pointer-events:none; opacity:0; transform:translate(-50%,58%) scale(.88) }
    .music {
      position:fixed;
      z-index:30;
      top:max(16px,env(safe-area-inset-top));
      left:16px;
      display:flex;
      align-items:center;
      gap:7px;
      padding:9px 12px;
      border:1px solid rgba(182,146,96,.35);
      border-radius:999px;
      background:rgba(255,250,241,.82);
      color:#674947;
      cursor:pointer;
      font-size:10px;
      opacity:0;
      pointer-events:none;
      transform:translateY(-8px);
      transition:.7s ease 3.15s;
      backdrop-filter:blur(9px);
    }
    .opened .music { opacity:1; pointer-events:auto; transform:none }
    .music i { color:var(--rose); font-style:normal; font-size:16px; animation:pulse 1.4s ease-in-out infinite }
    .music.off i { animation:none; opacity:.55 }
    @keyframes breathe { 0%,100%{opacity:.55;transform:translateY(0)} 50%{opacity:1;transform:translateY(-3px)} }
    @keyframes pulse { 0%,100%{transform:scale(.92) rotate(-5deg)} 50%{transform:scale(1.1) rotate(5deg)} }
    @keyframes twinkle { 0%,100%{opacity:.25;transform:scale(.7)} 50%{opacity:1;transform:scale(1.15)} }
    @media (max-height:690px) {
      .wrap{height:96svh}
      .card{height:77%;top:12%}
      .content{padding:35px 25px 27px}
      h1{font-size:34px}
      .copy{margin-bottom:9px;font-size:14px}
      .date{margin-bottom:7px;font-size:12.5px}
      .divider{margin:8px auto 7px}
      .address{font-size:10.5px}
      .map{margin-top:7px}
      .opened .card{transform:translate(-50%,-8%) scale(.93)}
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button class="music" id="music" type="button" aria-label="قطع موسیقی"><i>♫</i><span>موسیقی در حال پخش</span></button>
    <div class="wrap">
      <section class="card" aria-label="متن دعوت‌نامه">
        <div class="lace top" aria-hidden="true"></div>
        <div class="guipure left" aria-hidden="true"></div>
        <div class="guipure right" aria-hidden="true"></div>
        <div class="content">
          <p class="intro">به نام عشق</p>
          <h1>سارا <span>و</span> حسین</h1>
          <div class="ornament" aria-hidden="true">◆</div>
          <p class="copy">به رسم محبت<br>شما را به جشن پیوندمان دعوت می‌کنیم</p>
          <p class="date">۲۹ مرداد ۱۴۰۵</p>
          <div>
            <span class="label">زمان مراسم</span>
            <p class="time"><strong>ساعت ۱۵:۳۰ تا ۱۸:۰۰</strong></p>
          </div>
          <div class="divider" aria-hidden="true"></div>
          <div>
            <span class="label">نشانی</span>
            <p class="address">سعادت‌آباد، بلوار دریا، بعد از تقاطع پاکنژاد به سمت غرب، شکوفان ۲، بهاران ۱، پلاک ۱۰/۱، طبقه ۱</p>
          </div>
          <a class="map" target="_blank" rel="noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=%D8%B3%D8%B9%D8%A7%D8%AF%D8%AA%E2%80%8C%D8%A2%D8%A8%D8%A7%D8%AF%D8%8C%20%D8%A8%D9%84%D9%88%D8%A7%D8%B1%20%D8%AF%D8%B1%DB%8C%D8%A7%D8%8C%20%D8%A8%D8%B9%D8%AF%20%D8%A7%D8%B2%20%D8%AA%D9%82%D8%A7%D8%B7%D8%B9%20%D9%BE%D8%A7%DA%A9%D9%86%DA%98%D8%A7%D8%AF%20%D8%A8%D9%87%20%D8%B3%D9%85%D8%AA%20%D8%BA%D8%B1%D8%A8%D8%8C%20%D8%B4%DA%A9%D9%88%D9%81%D8%A7%D9%86%20%DB%B2%D8%8C%20%D8%A8%D9%87%D8%A7%D8%B1%D8%A7%D9%86%20%DB%B1%D8%8C%20%D9%BE%D9%84%D8%A7%DA%A9%20%DB%B1%DB%B0%2F%DB%B1%D8%8C%20%D8%B7%D8%A8%D9%82%D9%87%20%DB%B1">مشاهده مسیر روی نقشه</a>
          <p class="footer">مشتاق دیدار شماییم</p>
        </div>
        <div class="lace bottom" aria-hidden="true"></div>
      </section>
      <button class="envelope" id="envelope" type="button" aria-label="باز کردن دعوت‌نامه سارا و حسین">
        <span class="back" aria-hidden="true"></span>
        <span class="lining" aria-hidden="true"></span>
        <span class="flap" aria-hidden="true"></span>
        <span class="left" aria-hidden="true"></span>
        <span class="right" aria-hidden="true"></span>
        <span class="front" aria-hidden="true"></span>
        <span class="seal" aria-hidden="true"><span>س</span><b>و</b><span>ح</span></span>
        <span class="hint">برای باز کردن لمس کنید</span>
      </button>
    </div>
  </main>
  <script>
    (() => {
      const stage = document.getElementById('stage');
      const envelope = document.getElementById('envelope');
      const musicButton = document.getElementById('music');
      let context = null;
      let timer = null;
      const notes = [
        [261.63,0,.8,.055],[329.63,.1,.7,.04],[392,.2,.8,.038],
        [523.25,.8,.75,.052],[493.88,1.6,.75,.052],[440,2.4,.8,.052],
        [349.23,3.2,.75,.05],[293.66,4,.75,.05],[329.63,4.8,.75,.05],
        [392,5.6,1.2,.055],[246.94,3.2,.8,.032],[293.66,3.3,.75,.03],
        [349.23,3.4,.8,.028],[196,5.6,1.25,.033],[246.94,5.7,1.15,.028]
      ];
      function play(offset=0) {
        const master=context.createGain();
        master.gain.setValueAtTime(.62,context.currentTime);
        master.connect(context.destination);
        notes.forEach(([frequency,start,duration,volume])=>{
          const oscillator=context.createOscillator();
          const gain=context.createGain();
          oscillator.type='sine';
          oscillator.frequency.setValueAtTime(frequency,context.currentTime);
          gain.gain.setValueAtTime(.0001,context.currentTime+offset+start);
          gain.gain.exponentialRampToValueAtTime(volume,context.currentTime+offset+start+.06);
          gain.gain.exponentialRampToValueAtTime(.0001,context.currentTime+offset+start+duration);
          oscillator.connect(gain); gain.connect(master);
          oscillator.start(context.currentTime+offset+start);
          oscillator.stop(context.currentTime+offset+start+duration+.08);
        });
      }
      async function startMusic() {
        if (!context) {
          context=new (window.AudioContext||window.webkitAudioContext)();
          play(.15);
          timer=setInterval(()=>play(),7200);
        } else if (context.state==='suspended') await context.resume();
        musicButton.classList.remove('off');
        musicButton.querySelector('span').textContent='موسیقی در حال پخش';
        musicButton.setAttribute('aria-label','قطع موسیقی');
      }
      envelope.addEventListener('click',()=>{
        stage.classList.add('opened');
        startMusic();
      },{once:true});
      musicButton.addEventListener('click',async()=>{
        if (!context) return startMusic();
        if (context.state==='running') {
          await context.suspend();
          musicButton.classList.add('off');
          musicButton.querySelector('span').textContent='پخش موسیقی';
          musicButton.setAttribute('aria-label','پخش موسیقی');
        } else {
          await startMusic();
        }
      });
      window.addEventListener('pagehide',()=>{ if(timer) clearInterval(timer); if(context) context.close(); },{once:true});
    })();
  </script>
</body>
</html>
