<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e7bdca">
  <title>پیش‌نمایش جدید دعوت‌نامه سارا و حسین</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --ivory:#fffaf7;
      --cream:#fff3ef;
      --blush:#efc8d3;
      --blush-deep:#d98ba4;
      --rose:#a64e6e;
      --rose-dark:#713047;
      --wine:#652f42;
      --gold:#b88a4f;
      --gold-light:#e5c99b;
      --ink:#553d43;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      overflow:hidden;
      background:#e9c4cf;
      color:var(--ink);
      font-family:"Vazirmatn",Tahoma,sans-serif;
    }
    button,a{font:inherit;-webkit-tap-highlight-color:transparent}
    .stage{
      position:relative;
      min-height:100svh;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(ellipse at 50% 8%,rgba(255,255,255,.92),transparent 43%),
        radial-gradient(circle at 9% 88%,rgba(166,78,110,.18),transparent 32%),
        radial-gradient(circle at 92% 13%,rgba(255,255,255,.54),transparent 25%),
        linear-gradient(145deg,#e4b7c5,#f7e0e6 47%,#dfacbd);
    }
    .stage::before{
      position:absolute;inset:0;z-index:-4;content:"";pointer-events:none;opacity:.5;
      background:
        repeating-linear-gradient(37deg,rgba(255,255,255,.22) 0 1px,transparent 1px 10px),
        repeating-linear-gradient(-37deg,rgba(255,255,255,.15) 0 1px,transparent 1px 12px);
      mask-image:linear-gradient(90deg,#000,transparent 37%,transparent 63%,#000);
    }
    .tulle{
      position:absolute;z-index:-3;top:-18%;width:43vw;height:140vh;opacity:.72;pointer-events:none;
      border:1px solid rgba(255,255,255,.4);
      background:
        repeating-linear-gradient(68deg,rgba(255,255,255,.42) 0 1px,transparent 1px 8px),
        repeating-linear-gradient(-68deg,rgba(255,255,255,.25) 0 1px,transparent 1px 9px),
        linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,.02));
      filter:blur(.2px) drop-shadow(0 0 24px rgba(255,255,255,.25));
    }
    .tulle.left{left:-22%;transform:rotate(-7deg)}
    .tulle.right{right:-22%;transform:rotate(7deg) scaleX(-1)}
    .botanical{position:absolute;z-index:-2;width:min(42vw,260px);height:auto;opacity:.28;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(113,48,71,.08))}
    .botanical.left{left:-7%;bottom:-4%;transform:rotate(9deg)}
    .botanical.right{right:-8%;top:-4%;transform:rotate(187deg)}
    .dust{position:absolute;inset:0;pointer-events:none}
    .dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 13px 3px rgba(255,255,255,.72);animation:glow 3.4s ease-in-out infinite}
    .dust i:nth-child(1){top:12%;left:24%}.dust i:nth-child(2){top:29%;right:14%;animation-delay:.8s}.dust i:nth-child(3){bottom:18%;left:15%;animation-delay:1.6s}.dust i:nth-child(4){bottom:11%;right:24%;animation-delay:2.4s}
    .scene{
      position:absolute;top:50%;left:50%;width:min(92vw,440px);height:min(810px,95svh);
      transform:translate(-50%,-50%);perspective:1400px;
    }
    .card{
      position:absolute;z-index:2;top:12%;left:50%;width:91%;height:76%;overflow:hidden;
      border:1px solid rgba(184,138,79,.44);border-radius:7px;
      background:
        linear-gradient(rgba(255,250,247,.975),rgba(255,248,245,.975)),
        repeating-linear-gradient(17deg,transparent 0 8px,rgba(113,48,71,.04) 8px 9px);
      box-shadow:0 22px 56px rgba(82,44,59,.25),inset 0 0 0 8px rgba(255,255,255,.5);
      opacity:0;transform:translate(-50%,34%) scale(.88);
      transition:transform 2.25s cubic-bezier(.17,.8,.18,1) 1.18s,opacity .75s ease 1.05s;
    }
    .card::after{
      position:absolute;inset:15px;z-index:0;border:1px solid rgba(184,138,79,.35);border-radius:120px 120px 8px 8px/42px 42px 8px 8px;content:"";pointer-events:none;
    }
    .opened .card{z-index:12;opacity:1;transform:translate(-50%,-4%) scale(1)}
    .card-content{
      position:relative;z-index:4;display:flex;height:100%;flex-direction:column;align-items:center;padding:72px 48px 61px;text-align:center;
    }
    .eyebrow{margin:0 0 2px;color:var(--gold);font-size:10px;font-weight:400;letter-spacing:.05em}
    .names{
      margin:-5px 0 0;color:var(--rose-dark);font-family:"Noto Nastaliq Urdu","B Nazanin",serif;font-size:clamp(40px,11.5vw,55px);font-weight:700;line-height:1.65;text-shadow:0 2px 0 rgba(255,255,255,.9);
    }
    .names em{margin:0 5px;color:var(--gold);font-size:.49em;font-style:normal;font-weight:400}
    .filigree{display:flex;width:150px;align-items:center;gap:8px;margin:-10px 0 10px;color:var(--gold)}
    .filigree::before,.filigree::after{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold));content:""}.filigree::after{transform:scaleX(-1)}
    .filigree svg{width:25px;height:19px}
    .copy{margin:0 0 9px;color:#61494f;font-family:"Noto Nastaliq Urdu","B Nazanin",serif;font-size:18px;font-weight:400;line-height:2.05}
    .date{margin:0 0 8px;color:var(--rose);font-size:13px;font-weight:600}
    .time{margin:0;color:#4f3b40;font-size:12.5px;font-weight:500}
    .tiny-rule{display:flex;width:64px;align-items:center;gap:7px;margin:11px auto 9px;color:var(--gold);font-size:7px}.tiny-rule::before,.tiny-rule::after{height:1px;flex:1;background:rgba(184,138,79,.6);content:""}
    .label{display:block;margin-bottom:2px;color:var(--gold);font-size:8.5px;font-weight:500}
    .address{max-width:300px;margin:0;font-size:10.6px;font-weight:300;line-height:1.9}
    .map{margin-top:9px;border-bottom:1px solid rgba(166,78,110,.32);color:var(--rose);font-size:9px;text-decoration:none}
    .footer{margin:auto 0 0;color:var(--gold);font-family:"Noto Nastaliq Urdu",serif;font-size:12px}
    .lace-top,.lace-bottom{position:absolute;right:7px;left:7px;z-index:3;width:calc(100% - 14px);height:72px;overflow:visible;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(113,48,71,.08))}
    .lace-top{top:0}.lace-bottom{bottom:0;transform:rotate(180deg)}
    .side-lace{position:absolute;z-index:3;top:67px;bottom:67px;width:39px;height:calc(100% - 134px);pointer-events:none;opacity:.92}
    .side-lace.left{left:1px}.side-lace.right{right:1px;transform:scaleX(-1)}
    .envelope{
      position:absolute;z-index:9;top:54%;left:50%;width:100%;aspect-ratio:1.46/1;padding:0;border:0;background:transparent;cursor:pointer;outline:0;
      filter:drop-shadow(0 27px 25px rgba(87,43,60,.27));transform:translate(-50%,-11%);
      transition:transform 1.35s ease 2.5s,opacity 1.05s ease 2.5s;
    }
    .envelope>span{position:absolute;display:block}
    .env-back{inset:0;border-radius:8px;background:linear-gradient(145deg,#ecc2cf,#d997ac)}
    .env-lining{
      inset:0;clip-path:polygon(0 0,100% 0,50% 72%);
      background:
        repeating-linear-gradient(34deg,rgba(255,255,255,.13) 0 1px,transparent 1px 9px),
        repeating-linear-gradient(-34deg,rgba(255,255,255,.1) 0 1px,transparent 1px 10px),#ad5b77;
    }
    .env-flap{
      z-index:6;inset:0;overflow:hidden;clip-path:polygon(0 0,100% 0,50% 70%);transform-origin:top center;transform:perspective(1400px) rotateX(0);backface-visibility:hidden;
      background:linear-gradient(155deg,#f7dce5 3%,#e4aebf 62%,#d890a8);transition:transform 1.85s cubic-bezier(.41,0,.18,1);
    }
    .flap-lace{position:absolute;top:5%;left:3%;width:94%;height:49%;opacity:.94;filter:drop-shadow(0 2px 2px rgba(113,48,71,.12))}
    .env-left{z-index:3;inset:0;clip-path:polygon(0 0,57% 51%,0 100%);background:linear-gradient(80deg,#f3ced9,#dda0b4)}
    .env-right{z-index:3;inset:0;clip-path:polygon(100% 0,43% 51%,100% 100%);background:linear-gradient(-80deg,#f1c9d6,#d993aa)}
    .env-front{
      z-index:4;inset:0;clip-path:polygon(0 100%,0 50%,50% 73%,100% 50%,100% 100%);border-radius:0 0 8px 8px;
      background:
        repeating-linear-gradient(36deg,rgba(255,255,255,.08) 0 1px,transparent 1px 10px),
        linear-gradient(0deg,#efbfd0,#dda0b5);
    }
    .ribbon-h{z-index:5;top:43%;right:0;left:0;height:43px;background:linear-gradient(180deg,rgba(255,249,242,.72),rgba(244,225,214,.88) 45%,rgba(220,184,163,.72));box-shadow:0 2px 4px rgba(101,47,66,.12),inset 0 1px rgba(255,255,255,.82)}
    .seal{
      z-index:8;top:50%;left:50%;width:90px;height:90px;transform:translate(-50%,-50%) rotate(-4deg);transition:opacity .7s ease .75s,transform .7s ease .75s;
      filter:drop-shadow(0 8px 7px rgba(77,31,48,.37));
    }
    .seal svg{width:100%;height:100%;overflow:visible}
    .hint{z-index:10;right:0;bottom:-45px;left:0;color:#6e4654;font-size:11px;font-weight:400;text-align:center;animation:breathe 2.3s ease-in-out infinite}
    .opened .env-flap{z-index:1;transform:perspective(1400px) rotateX(180deg)}
    .opened .seal{opacity:0;transform:translate(-50%,-82%) scale(.73) rotate(13deg)}
    .opened .envelope{pointer-events:none;opacity:0;transform:translate(-50%,66%) scale(.86)}
    .music{
      position:fixed;z-index:30;top:max(15px,env(safe-area-inset-top));left:15px;display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid rgba(184,138,79,.38);border-radius:999px;background:rgba(255,250,247,.82);color:#65434f;cursor:pointer;font-size:9.5px;opacity:0;pointer-events:none;transform:translateY(-8px);transition:.7s ease 3.5s;backdrop-filter:blur(10px)
    }
    .opened .music{opacity:1;pointer-events:auto;transform:none}.music i{color:var(--rose);font-size:15px;font-style:normal;animation:pulse 1.5s ease-in-out infinite}.music.off i{animation:none;opacity:.5}
    @keyframes breathe{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
    @keyframes pulse{0%,100%{transform:scale(.92) rotate(-4deg)}50%{transform:scale(1.1) rotate(4deg)}}
    @keyframes glow{0%,100%{opacity:.2;transform:scale(.65)}50%{opacity:1;transform:scale(1.12)}}
    @media(max-height:720px){
      .scene{height:97svh}.card{top:8%;height:82%}.card-content{padding:62px 45px 50px}.names{font-size:38px}.copy{font-size:15.5px;line-height:1.9}.address{font-size:9.8px}.lace-top,.lace-bottom{height:60px}.side-lace{top:56px;bottom:56px;height:calc(100% - 112px)}.opened .card{transform:translate(-50%,-1%) scale(.95)}
    }
    @media(max-width:360px){.card-content{padding-right:43px;padding-left:43px}.address{font-size:9.7px}.names{font-size:37px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="tulle left" aria-hidden="true"></div><div class="tulle right" aria-hidden="true"></div>
    <svg class="botanical left" viewBox="0 0 250 400" aria-hidden="true"><g fill="none" stroke="#8c4961" stroke-width="2"><path d="M28 390C71 302 84 216 162 77"/><path d="M70 304c-31-31-45-61-38-91 39 8 58 34 56 69M104 233c-22-39-17-74 5-99 31 28 35 61 14 91M137 161c-5-40 9-69 40-87 19 37 7 67-25 88M61 327c34-19 66-19 94-1-24 31-56 38-89 15"/><g fill="#efd0da"><ellipse cx="170" cy="70" rx="22" ry="42" transform="rotate(28 170 70)"/><ellipse cx="170" cy="70" rx="22" ry="42" transform="rotate(100 170 70)"/><ellipse cx="170" cy="70" rx="22" ry="42" transform="rotate(172 170 70)"/></g><circle cx="170" cy="70" r="12" fill="#b77a8d"/></g></svg>

    <div class="scene">
      <article class="card" aria-label="متن دعوت‌نامه">

          <g opacity=".96"><use href="#laceBloom" x="45" y="26"/><use href="#laceBloom" x="122" y="27"/><use href="#laceBloom" x="200" y="27"/><use href="#laceBloom" x="278" y="27"/><use href="#laceBloom" x="355" y="26"/></g>

        <svg class="lace-bottom" viewBox="0 0 400 84" preserveAspectRatio="none" aria-hidden="true"><path d="M0 7H400V27C370 18 356 68 330 35c-20-25-42 33-68 5-25-28-45 26-68 2-27-29-48 31-75 2-24-26-42 23-69-6C30 16 17 37 0 31Z" fill="#f7dbe4" fill-opacity=".72" stroke="#c27a92" stroke-opacity=".7"/><g fill="#fff7f4" stroke="#c47b93" stroke-width="1.2"><circle cx="45" cy="26" r="13"/><circle cx="122" cy="27" r="13"/><circle cx="200" cy="27" r="13"/><circle cx="278" cy="27" r="13"/><circle cx="355" cy="26" r="13"/></g><path d="M14 52Q45 14 78 52t78 0t78 0t78 0t74 0" fill="none" stroke="#c27a92" stroke-width="1.2"/><path d="M10 64Q28 41 45 66Q62 41 80 64Q98 41 116 66Q134 41 152 64Q170 41 188 66Q206 41 224 64Q242 41 260 66Q278 41 296 64Q314 41 332 66Q350 41 390 64" fill="none" stroke="#d290a5" stroke-width="1"/></svg>

      <button class="envelope" id="envelope" type="button" aria-label="باز کردن دعوت‌نامه سارا و حسین">

  <script>
    (()=>{
      const stage=document.getElementById('stage');
      const envelope=document.getElementById('envelope');
      const musicButton=document.getElementById('music');
      let context=null,timer=null;
      const notes=[[261.63,0,.8,.055],[329.63,.1,.7,.04],[392,.2,.8,.038],[523.25,.8,.75,.052],[493.88,1.6,.75,.052],[440,2.4,.8,.052],[349.23,3.2,.75,.05],[293.66,4,.75,.05],[329.63,4.8,.75,.05],[392,5.6,1.2,.055],[246.94,3.2,.8,.032],[293.66,3.3,.75,.03],[349.23,3.4,.8,.028],[196,5.6,1.25,.033],[246.94,5.7,1.15,.028]];
      function play(offset=0){
        const master=context.createGain();master.gain.setValueAtTime(.62,context.currentTime);master.connect(context.destination);
        notes.forEach(([frequency,start,duration,volume])=>{const oscillator=context.createOscillator(),gain=context.createGain();oscillator.type='sine';oscillator.frequency.setValueAtTime(frequency,context.currentTime);gain.gain.setValueAtTime(.0001,context.currentTime+offset+start);gain.gain.exponentialRampToValueAtTime(volume,context.currentTime+offset+start+.06);gain.gain.exponentialRampToValueAtTime(.0001,context.currentTime+offset+start+duration);oscillator.connect(gain);gain.connect(master);oscillator.start(context.currentTime+offset+start);oscillator.stop(context.currentTime+offset+start+duration+.08)});
      }
      async function startMusic(){if(!context){context=new(window.AudioContext||window.webkitAudioContext)();play(.15);timer=setInterval(()=>play(),7200)}else if(context.state==='suspended')await context.resume();musicButton.classList.remove('off');musicButton.querySelector('span').textContent='موسیقی در حال پخش';musicButton.setAttribute('aria-label','قطع موسیقی')}
      envelope.addEventListener('click',()=>{stage.classList.add('opened');startMusic()},{once:true});
      musicButton.addEventListener('click',async()=>{if(!context)return startMusic();if(context.state==='running'){await context.suspend();musicButton.classList.add('off');musicButton.querySelector('span').textContent='پخش موسیقی';musicButton.setAttribute('aria-label','پخش موسیقی')}else await startMusic()});
      window.addEventListener('pagehide',()=>{if(timer)clearInterval(timer);if(context)context.close()},{once:true});
    })();
  </script>
